<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagniVinyl Taylor Swift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- La Platine Cible (Style MagniVinyl) -->
  <div class="turntable" id="drop-zone">
    <div class="platter" id="platter">

      <!-- Écran circulaire intégré au vinyle qui affichera la vidéo YouTube -->
      <div class="vinyl-on-player" id="current-vinyl">
        <div id="youtube-player"></div>
      </div>

      <!-- Axe central de la platine -->
      <div class="center-spindle"></div>
    </div>

    <!-- Le bras de lecture -->
    <div class="tonearm" id="tonearm"></div>
  </div>

  <!-- Le Rack de Vinyles (Glissables) -->
  <div class="vinyl-rack">
    <!-- Remplacez data-youtube par l'ID de la vidéo YouTube souhaitée -->
    <div class="vinyl-item" draggable="true" data-youtube="tgVYh94QH8k" data-cover="lover-cover.jpg">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqS4K4pNb0uD_0CsOmaVpP05KJ0y0Ml21Y8Pq1vcdG1g&s=10" alt="Lover">
      <span>Lover</span>
    </div>

    <div class="vinyl-item" draggable="true" data-youtube="Odh9ddPUkEY" data-cover="midnights-cover.jpg">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10" alt="Midnights">
      <span>Anti-Hero</span>
    </div>
  </div>

  <!-- Chargement de l'API iFrame YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Votre script JavaScript -->
  <script src="script.js"></script>

</body>
</html>
