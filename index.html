<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MagniVinyl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <!-- Colonne Gauche : Écran, Platine et Commandes -->
    <div class="player-column">

      <!-- Écran Vidéo -->
      <div class="screen-container">
        <div class="screen-frame">
          <div id="youtube-player"></div>
          <div class="screen-default" id="screen-default">
            <span>Veuillez mettre un CD dans le lecteur</span>
          </div>
        </div>
      </div>

      <!-- Platine tourne-disque -->
      <div class="turntable" id="drop-zone">
        <div class="platter" id="platter">
          <div class="vinyl-record" id="current-vinyl">
            <div class="vinyl-label" id="vinyl-label"></div>
          </div>
          <div class="center-spindle"></div>
        </div>
        <div class="tonearm" id="tonearm"></div>
      </div>

      <!-- Barre de commandes -->
      <div class="controls-bar">
        <button type="button" id="btn-play">▶ Play</button>
        <button type="button" id="btn-pause">⏸ Pause</button>
        <button type="button" id="btn-eject">⏏ Retirer le CD</button>
      </div>

    </div>

    <!-- Colonne Droite : Rack de Vinyles (Grille 5x2) -->
    <div class="rack-column">
      <div class="vinyl-rack">

        <!-- Disques disponibles -->
        <div class="vinyl-item" draggable="true" data-youtube="tgVYh94QH8k" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqS4K4pNb0uD_0CsOmaVpP05KJ0y0Ml21Y8Pq1vcdG1g&s=10">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTqS4K4pNb0uD_0CsOmaVpP05KJ0y0Ml21Y8Pq1vcdG1g&s=10" alt="Lover">
          <span>Lover</span>
        </div>

        <div class="vinyl-item" draggable="true" data-youtube="Odh9ddPUkEY" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10" alt="Midnights">
          <span>Midnight Rain</span>
        </div>

        <div class="vinyl-item" draggable="true" data-youtube="e-ORhEE9VVg" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSicxT76P3SNGzKmN-Ec-8WewrEx7GM4WMSSA53cquuaA&s=10" alt="Blank Space">
          <span>Blank Space</span>
        </div>

        <div class="vinyl-item" draggable="true" data-youtube="nfWlot6h_JM" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQREOfzMO000rhvf6RQ5ZTWmF2RG-QeACHrZwYNsEHqeQ&s=10" alt="Shake It Off">
          <span>Shake It Off</span>
        </div>

        <div class="vinyl-item" draggable="true" data-youtube="VuNIsY6JdUw" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2ID4f3Wal9tHCLwTvb3IfPGH6a3Wp4Wv3m3DQKGYZJA&s=10" alt="You Belong With Me">
          <span>You Belong With Me</span>
        </div>

        <div class="vinyl-item" draggable="true" data-youtube="QcIy9NiNbmo" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRJUj_Reox01CcPDmL2QkzlApWuOEZn_JQPBLfQOM2k_g&s" alt="Bad Blood">
          <span>Bad Blood</span>
        </div>

<!--    
        <div class="vinyl-item" draggable="true" data-youtube="" data-cover="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRW60D4TVzghFayK-EH1R0o9JCWoA33NoeAYGBBmfoSGw&s=10">
          <img src="" alt="">
          <span></span>
        </div>
-->

        <!-- Emplacements réservés pour les futurs disques -->
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>
        <div class="vinyl-placeholder"></div>

      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>

</body>
</html>
